<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{tool[1]}} — PDFWorld</title><link rel="stylesheet" href="/static/style.css"></head><body><header><div class="nav"><a class="brand" href="/">PDF<span>World</span></a><nav><a href="/">All Tools</a></nav></div></header><main><section class="toolpage"><a class="back" href="/">← All tools</a><div class="toolbox"><div class="tool-icon">{{tool[3]}}</div><h1>{{tool[1]}}</h1><p>{{tool[2]}}</p><form id="form" enctype="multipart/form-data"><label class="drop" id="drop"><input type="file" name="files" id="files" multiple required><strong>Choose files</strong><span>or drag & drop here</span><small>Maximum 100MB</small></label>{% if tool[0] in ['rotate-pdf'] %}<label>Rotation <select name="degrees"><option value="90">90°</option><option value="180">180°</option><option value="270">270°</option></select></label>{% endif %}{% if tool[0] in ['watermark-pdf'] %}<label>Watermark text<input name="text" value="CONFIDENTIAL"></label>{% endif %}{% if tool[0] in ['protect-pdf','unlock-pdf'] %}<label>Password<input type="password" name="password" required></label>{% endif %}<button class="primary full" type="submit">{{tool[1]}} →</button><div id="status"></div></form></div></section></main><script>const f=document.getElementById('form'),s=document.getElementById('status'),drop=document.getElementById('drop');['dragenter','dragover'].forEach(e=>drop.addEventListener(e,x=>{x.preventDefault();drop.classList.add('over')}));['dragleave','drop'].forEach(e=>drop.addEventListener(e,x=>{x.preventDefault();drop.classList.remove('over')}));drop.addEventListener('drop',e=>document.getElementById('files').files=e.dataTransfer.files);f.addEventListener('submit',async e=>{e.preventDefault();s.textContent='Processing…';const r=await fetch('/api/{{tool[0]}}',{method:'POST',body:new FormData(f)});if(!r.ok){const j=await r.json().catch(()=>({error:'Something went wrong'}));s.textContent=j.error;return}const b=await r.blob(),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download=r.headers.get('Content-Disposition')?.match(/filename="?([^";]+)"?/i)?.[1]||'download';a.click();URL.revokeObjectURL(u);s.textContent='Done — your download should start automatically.'});</script></body></html>
